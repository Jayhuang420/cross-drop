name = "crossdrop-turn"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Non-secret config. TURN_API_TOKEN (and optional PROXY_KEY) are Worker Secrets:
# set them in the Cloudflare dashboard (Worker → Settings → Variables and Secrets)
# or with `wrangler secret put TURN_API_TOKEN` — never here, never in git.
[vars]
TURN_KEY_ID = "6ac0e58a9780c7cff31ba24c52e08c25"
# Egress IP(s) of the CrossDrop server (Zeabur dedicated server). Empty = allow all.
ALLOWED_IPS = ""
CRED_TTL = "14400"

[observability]
enabled = true
